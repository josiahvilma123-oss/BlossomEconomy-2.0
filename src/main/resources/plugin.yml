name: BlossomEconomy
version: 2.5.0
main: com.blossomsmp.economy.BlossomEconomy
api-version: '1.21'
author: BlossomSMP
description: The all-in-one Blossom SMP economy (money, live market, shop, sell, auction house, pay, baltop, kill rewards).
depend: [Vault]
softdepend: [PlaceholderAPI]

commands:
  balance:
    description: Check your balance or another player's balance
    aliases: [bal, money]
  pay:
    description: Send money to another player
  baltop:
    description: Show the richest players
    aliases: [balancetop, moneytop]
  eco:
    description: Admin money commands
    permission: blossom.admin
  shop:
    description: Open the Blossom shop
  sellgui:
    description: Open a chest - put items in and close it to sell them all
    aliases: [sg, sellmenu]
  sell:
    description: Open the sell chest (/sell hand sells what you're holding)
    usage: /sell [hand]
  worth:
    description: Check the live price of the item in your hand
  discord:
    description: Get the Blossom SMP Discord link
    aliases: [dc]
  daily:
    description: Claim your daily reward
    aliases: [dailyreward, reward]
  ah:
    description: Open the auction house
    aliases: [auctionhouse, auction, auctions]

permissions:
  blossom.admin:
    description: Use /eco to give, take, set and reset money, and reload the config
    default: op
