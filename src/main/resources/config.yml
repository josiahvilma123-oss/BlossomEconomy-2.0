# ============================================
#   ❀ BlossomEconomy 2.4 - Blossom SMP ❀
# ============================================
# Colours: &a, &d, &l ... and hex colours like &#FF69B4
# After editing, run: /eco reload

# Money every new player starts with
starting-balance: 500

# How often balances and market prices are saved (minutes)
autosave-minutes: 5

# Smallest amount allowed with /pay
min-pay: 1

# Can players in creative mode use /sell? (set to false so staff can't print money)
allow-creative-selling: true

# ----------------------------------------------
# Automatic prices
# Items NOT in the 'prices' list get a value from their crafting recipe,
# e.g. a diamond pickaxe = 3 diamonds + 2 sticks. Items that can't be
# crafted (spawn eggs, command blocks...) stay unsellable.
# ----------------------------------------------
auto-pricing:
  enabled: true
  # Crafted items are worth this % of their ingredients (below 100 stops craft-for-profit tricks)
  craft-value-percent: 90

# Extra money per enchantment level when selling (Sharpness V = 5 levels).
# Enchanted books can be sold too. Damaged items sell for less.
enchant-value-per-level: 5

# ----------------------------------------------
# Show the value of the item you're holding above the hotbar
# ----------------------------------------------
price-display:
  enabled: true
  format: "&7Worth: &a%each% &8each &8| &a%stack% &7stack &8| %trend%"

# ----------------------------------------------
# Live market
# Selling an item lowers its price, buying it from /shop raises it.
# Prices slowly return to normal when nobody trades the item.
# ----------------------------------------------
market:
  # Shop buy price = normal price x this (higher = everything in /shop costs more)
  buy-multiplier: 10.0
  # How much ONE item sold/bought moves the price (0.001 = 0.1%, so a stack of 64 moves it about 6%)
  impact-per-item: 0.001
  # Lowest a price can drop to (% of normal)
  min-price-percent: 25
  # Highest a price can rise to (% of normal)
  max-price-percent: 300
  # Every recovery-minutes, prices move this % of the way back to normal
  recovery-percent: 5
  recovery-minutes: 5

# ----------------------------------------------
# Fixed shop BUY prices. These ignore buy-multiplier.
# Selling prices are NOT changed by this list.
# Add any item here to give it its own /shop price.
# ----------------------------------------------
buy-prices:
  TOTEM_OF_UNDYING: 75000
  NETHERITE_SCRAP: 25000
  NETHERITE_INGOT: 120000
  NETHERITE_BLOCK: 1080000
  NETHERITE_UPGRADE_SMITHING_TEMPLATE: 75000
  ANCIENT_DEBRIS: 25000
  DIAMOND: 2000
  DIAMOND_BLOCK: 18000
  GOLDEN_APPLE: 3000
  ENCHANTED_GOLDEN_APPLE: 150000
  ENDER_PEARL: 1000
  EXPERIENCE_BOTTLE: 500
  SHULKER_SHELL: 15000
  SHULKER_BOX: 35000
  TNT: 1000
  COBWEB: 400
  BLAZE_ROD: 800
  EMERALD: 1200
  EMERALD_BLOCK: 10800
  ELYTRA: 250000
  MACE: 200000
  TRIDENT: 50000

# ----------------------------------------------
# Discord (/discord)
# ----------------------------------------------
discord:
  link: "https://discord.gg/EbMR5cU9c2"
  message: "&#FF69B4&l❀ &7Join the &#FF69B4Blossom SMP &7Discord for events, giveaways and support!"
  button: "&#FF69B4&l[CLICK TO JOIN]"
  hover: "&7Click to open &f%link%"

# ----------------------------------------------
# Daily rewards (/daily)
# Claim once every cooldown-hours. Claim again within streak-reset-hours
# to keep your streak; miss it and you start again at day 1.
# ----------------------------------------------
daily-rewards:
  enabled: true
  cooldown-hours: 24
  streak-reset-hours: 48
  # Money for day 1, day 2, day 3... After the last day, the last amount repeats.
  rewards: [100, 150, 200, 300, 400, 500, 1000]

# ----------------------------------------------
# Auction house (/ah)
# ----------------------------------------------
auction:
  title: "&#FF69B4&l❀ Auction House"
  # % of the sale price the server keeps
  tax-percent: 5
  # How many items one player can list at once
  max-listings: 5
  # How long listings last before they return to the seller
  duration-hours: 48
  min-price: 1
  max-price: 1000000000000

# ----------------------------------------------
# PvP kill rewards
# ----------------------------------------------
kill-rewards:
  enabled: true
  # Money the killer gets for every player kill
  amount: 50
  # Extra % of the victim's balance moved to the killer (0 = off)
  steal-percent: 0
  # Seconds before killing the SAME player pays again (stops kill farming)
  same-victim-cooldown: 300

